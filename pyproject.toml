[project]
name = "gtclass"
version = "0.1.0"
description = "CLI to browse GT course data and watch CRNs for seat/waitlist changes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
gtclass = "gtclass.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
